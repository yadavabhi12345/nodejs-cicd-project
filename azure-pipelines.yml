trigger:
  - main

variables:
  system.debug: true

pool:
  name: aws-ec2-pool

stages:

- stage: CI
  displayName: 'Continuous Integration'

  jobs:
  - job: BuildAndTest
    displayName: 'Build & Test'

    steps:
    - script: |
        echo "Checking Node.js and npm versions"
        node --version
        npm --version
      displayName: 'Check Node.js and npm'

    - script: |
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        npm test -- --runInBand
      displayName: 'Run Unit Tests'

- stage: CT
  displayName: 'Continuous Testing'
  dependsOn: CI
  condition: succeeded()

  jobs:
  - job: SonarQube
    displayName: 'SonarQube Analysis'

    steps:
    - checkout: self

    - script: |
        npx --yes sonarqube-scanner \
          -Dsonar.host.url="http://3.85.202.235:9000" \
          -Dsonar.token="$(SONAR_TOKEN)" \
          -Dsonar.projectKey="nodejs-cicd-project" \
          -Dsonar.projectName="nodejs-cicd-project" \
          -Dsonar.sources="." \
          -Dsonar.exclusions="**/node_modules/**,**/*.spec.js,**/*.test.js"
      displayName: 'Execute SonarQube Scan'
      env:
        JAVA_HOME: $(JAVA_HOME)
